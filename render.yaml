services:
  - type: web
    name: campus-desk
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: PUBLIC_DEMO
        value: "1"
      - key: OPENAI_BASE_URL
        value: https://llm.nat-d.uk/v1
      - key: OPENAI_API_KEY
        sync: false
